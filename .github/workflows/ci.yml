name: NutriMap Secure Pipeline

on:
  push:
    branches: [ "main", "develop" , "feature/*"]  # ✅ Escucha todas las ramas necesarias

jobs:
  # CAPA 1: SEGURIDAD Y CALIDAD (SAST)
  security-and-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Tools
        run: pip install bandit pytest

      - name: SAST - Scan Security Domain
        run: bandit -r src -ll

      - name: Run Unit Tests
        run: pytest tests

  # CAPA 2: EMPAQUETADO (DOCKER)
  build-docker:
    needs: security-and-testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Image
        run: docker build -t nutrimap-app .

  # CAPA 3: DEPLOY DEV (solo desde develop)
  deploy-to-dev:
    needs: build-docker
    if: github.ref == 'refs/heads/develop'  # ✅ Solo develop
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render Development
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_DEV }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"

  smoke-test:
    needs: deploy-to-dev
    runs-on: ubuntu-latest
    steps:
      - name: Esperar que Render inicie
        run: sleep 30

      - name: Verificar que Dev responde
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://nutrimap-dev.onrender.com/health)
            if [[ $STATUS -eq 200 ]]; then
              echo "✅ Dev responde correctamente (HTTP $STATUS)"
              exit 0
            fi
            echo "Intento $i fallido (HTTP $STATUS), reintentando..."
            sleep 10
          done
          echo "❌ Dev no responde después de 5 intentos"
          exit 1

  # CAPA 4: DEPLOY PROD (solo desde main + 2 aprobaciones)
  deploy-to-prod:
    needs: smoke-test
    if: github.ref == 'refs/heads/main'     # ✅ Solo main
    runs-on: ubuntu-latest
    environment: production                  # 👥 Requiere 2 aprobaciones
    steps:
      - name: Deploy to Render Production
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_PROD }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"