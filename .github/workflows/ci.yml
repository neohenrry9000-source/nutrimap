name: NutriMap Secure Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*" ]

jobs:
  security-and-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Actualizado a v4 para evitar warnings de Node.js
      - name: Install Tools
        run: pip install bandit pytest
      - name: SAST - Scan Security Domain
        # Escanea toda la carpeta backend, pero excluye (exclude) los tests
        run: bandit -r backend/ -x backend/tests -ll
      - name: Run Unit Tests
        run: pytest backend/tests

  build-docker:
    needs: security-and-testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Image
        run: docker build -t nutrimap-app ./backend

  deploy-to-dev:
    needs: build-docker
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render Dev
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_DEV }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"

  smoke-test:
    needs: deploy-to-dev
    runs-on: ubuntu-latest
    steps:
      - name: Esperar que Render inicie
        run: sleep 30
      - name: Verificar que Dev responde
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://nutrimap-dev.onrender.com/api/health)
            if [[ $STATUS -eq 200 ]]; then
              echo "✅ Dev responde (HTTP $STATUS)"
              exit 0
            fi
            echo "Intento $i fallido, reintentando..."
            sleep 10
          done
          exit 1

  deploy-to-prod:
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Render Prod
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_PROD }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"

  smoke-test-prod:
    needs: deploy-to-prod
    runs-on: ubuntu-latest
    steps:
      - name: Esperar que Render inicie
        run: sleep 30
      - name: Verificar que Prod responde
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://nutrimap-prod.onrender.com/api/health)
            if [[ $STATUS -eq 200 ]]; then
              echo "✅ Prod responde (HTTP $STATUS)"
              exit 0
            fi
            echo "Intento $i fallido, reintentando..."
            sleep 10
          done
          exit 1