name: NutriMap Secure Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  # CAPA 1: SEGURIDAD Y CALIDAD (SAST)
  security-and-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Tools
        run: pip install bandit pytest

      - name: SAST - Scan Security Domain
        # Buscamos vulnerabilidades en el cifrado y manejo de datos
        run: bandit -r src -ll 

      - name: Run Unit Tests
        run: pytest tests

  # CAPA 2: EMPAQUETADO (DOCKER)
  build-docker:
    needs: security-and-testing
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v3
      - name: Build Image
        run: docker build -t nutrimap-app . # Garantiza consistencia

  # CAPA 3: DESPLIEGUE Y VALIDACIÓN (CD)
  deploy-to-dev:
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render Development
        # Este paso siempre se ejecuta para mantener actualizado el entorno de pruebas
        run: |
          curl -X POST https://api.render.com/deploy/${{ secrets.RENDER_SERVICE_ID_DEV }}?key=${{ secrets.RENDER_API_KEY }}
  
  deploy-to-prod:
    needs: deploy-to-dev
    # LA CLAVE: Solo se ejecuta si el código está en la rama 'main'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render Production
        run: |
          curl -X POST https://api.render.com/deploy/${{ secrets.RENDER_SERVICE_ID_PROD }}?key=${{ secrets.RENDER_API_KEY }}